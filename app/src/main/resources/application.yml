server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_guide
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  profiles:
    active: default

  # 启用虚拟线程（Java 21+），Tomcat 请求处理和 @Async 自动使用虚拟线程
  threads:
    virtual:
      enabled: true

  mvc:
    # Spring Boot 3.5+ 对缺失静态资源默认抛 NoResourceFoundException，关闭它直接返回 404
    throw-exception-if-no-resource-found: false
  web:
    resources:
      # 纯 API 项目，禁用静态资源映射，避免 favicon.ico 等请求报错
      add-mappings: false

  ai:
    # 禁用自动重试机制，让异常立即返回
    retry:
      max-attempts: 1
      on-client-errors: false
    # OpenAI兼容模式配置（通过DashScope OpenAI-compatible端点）
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${AI_MODEL:glm-5.2}
          temperature: 0.7
      embedding:
        options:
          model: qwen3.7-text-embedding
          dimensions: 1024
    # PostgreSQL Vector Store配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        remove-existing-vector-store-table: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      table-prefix: ""
  type-aliases-package: com.edu.muc.app.modules.resume.domain

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:my-interview}
  secure: false

# RAG 配置
rag:
  retrieval:
    top-k: 15
    final-top-k: 5
    similarity-threshold: 0.3

# 语音面试配置（ASR/TTS 共用阿里云百炼 API Key）
app:
  voice-interview:
    llm-streaming-enabled: true
    chunked-audio-enabled: true
    max-concurrent-tts-per-session: 3
    qwen:
      asr:
        url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
        model: ${AI_ASR_MODEL:qwen-audio-3.0-asr-flash-streaming}
        api-key: ${DASHSCOPE_API_KEY:}
        language: zh
        format: pcm
        sample-rate: 16000
        enable-turn-detection: true
        turn-detection-type: server_vad
        turn-detection-silence-duration-ms: 400
      tts:
        model: ${AI_TTS_MODEL:qwen3-tts-flash-realtime}
        api-key: ${DASHSCOPE_API_KEY:}
        voice: ${AI_TTS_VOICE:Cherry}
        format: pcm
        sample-rate: 24000
        mode: commit
        language-type: Chinese
