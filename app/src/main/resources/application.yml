server:
  port: 8080

spring:
  datasource:
    # 支持 Docker Compose（POSTGRES_HOST/POSTGRES_PORT/POSTGRES_DB）与本地开发（DB_USERNAME/DB_PASSWORD）两套环境变量
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview_guide}
    username: ${DB_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:password}}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  profiles:
    active: default

  # 启用虚拟线程（Java 21+），Tomcat 请求处理和 @Async 自动使用虚拟线程
  threads:
    virtual:
      enabled: true

  mvc:
    # Spring Boot 3.5+ 对缺失静态资源默认抛 NoResourceFoundException，关闭它直接返回 404
    throw-exception-if-no-resource-found: false
  web:
    resources:
      # 纯 API 项目，禁用静态资源映射，避免 favicon.ico 等请求报错
      add-mappings: false

  ai:
    # 禁用自动重试机制，让异常立即返回
    retry:
      max-attempts: 1
      on-client-errors: false
    # OpenAI兼容模式配置（通过DashScope OpenAI-compatible端点）
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${AI_MODEL:glm-5.2}
          temperature: 0.7
      embedding:
        options:
          model: qwen3.7-text-embedding
          dimensions: 1024
    # PostgreSQL Vector Store配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
        remove-existing-vector-store-table: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      table-prefix: ""
  type-aliases-package: com.edu.muc.app.modules.resume.domain

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:my-interview}
  secure: false

# RAG 配置（top-k 依据 eval/output/compare_output.log 的 RAGAS 评测最优值 10/0.3 调整）
rag:
  retrieval:
    top-k: 10
    final-top-k: 5
    similarity-threshold: 0.3
    # 关键词路召回数（pg_trgm，与向量路保持一致，维持"Top-10 召回"口径）
    keyword-top-k: ${RAG_KEYWORD_TOP_K:10}
    # 重排（gte-rerank-v2 交叉编码器，失败自动降级为 RRF 融合顺序）
    rerank:
      enabled: ${RAG_RERANK_ENABLED:true}
      url: ${RAG_RERANK_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
      model: ${RAG_RERANK_MODEL:gte-rerank-v2}
      timeout-seconds: ${RAG_RERANK_TIMEOUT:5}
    # 高频问题向量缓存（向量化前置：问题哈希→向量，命中跳过 embedding 调用）
    embedding-cache:
      enabled: ${RAG_EMBEDDING_CACHE_ENABLED:true}
      ttl-seconds: ${RAG_EMBEDDING_CACHE_TTL:3600}

# 业务配置
app:
  # 面试配置（环境变量 APP_INTERVIEW_FOLLOW_UP_COUNT 可覆盖）
  interview:
    follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:2}
  # LLM Provider 配置（LlmProviderRegistry 的数据种子；默认走 DashScope OpenAI 兼容端点）
  ai:
    default-provider: dashscope
    default-embedding-provider: dashscope
    embedding-dimensions: 1024
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${DASHSCOPE_API_KEY:}
        model: ${AI_MODEL:glm-5.2}
        embedding-model: qwen3.7-text-embedding
        embedding-dimensions: 1024
        supports-embedding: true
        temperature: 0.7
    security:
      # API Key 加密密钥（AES-256-GCM）；不配置时使用开发用固定密钥并打印警告
      api-key-encryption-key: ${APP_AI_CONFIG_ENCRYPTION_KEY:}
  # 语音面试配置（ASR/TTS 共用阿里云百炼 API Key）
  voice-interview:
    llm-streaming-enabled: true
    chunked-audio-enabled: true
    max-concurrent-tts-per-session: 3
    qwen:
      asr:
        url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
        model: ${AI_ASR_MODEL:qwen-audio-3.0-asr-flash-streaming}
        api-key: ${DASHSCOPE_API_KEY:}
        language: zh
        format: pcm
        sample-rate: 16000
        enable-turn-detection: true
        turn-detection-type: server_vad
        turn-detection-silence-duration-ms: 400
      tts:
        model: ${AI_TTS_MODEL:qwen3-tts-flash-realtime}
        api-key: ${DASHSCOPE_API_KEY:}
        voice: ${AI_TTS_VOICE:Cherry}
        format: pcm
        sample-rate: 24000
        mode: commit
        language-type: Chinese
