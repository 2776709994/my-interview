server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_guide
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none  # 禁用自动建表，使用 MyBatis-Plus
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      connection:
        connection-pool-size: 6
        max-async-requests: 5
      chat:
        options:
          model: qwen-plus
          # 增加温度值让响应更快
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v2
    # 重试配置
    retry:
      max-attempts: 3        # 最大重试次数
      backoff:
        initial-interval: 2000  # 初始重试间隔 2秒
        multiplier: 2           # 重试间隔倍数
        max-interval: 10000     # 最大重试间隔 10秒
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      table-prefix: ""
  type-aliases-package: com.edu.muc.app.modules.resume.domain

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:my-interview}
  secure: false

# RAG 配置
rag:
  retrieval:
    top-k: 10              # 初始召回数量
    final-top-k: 5         # 最终返回数量
    similarity-threshold: 0.3  # 相似度阈值（余弦距离，越小越相似）