server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_guide
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  profiles:
    active: default

  mvc:
    # Spring Boot 3.5+ 对缺失静态资源默认抛 NoResourceFoundException，关闭它直接返回 404
    throw-exception-if-no-resource-found: false
  web:
    resources:
      # 纯 API 项目，禁用静态资源映射，避免 favicon.ico 等请求报错
      add-mappings: false

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      connection:
        connection-pool-size: 6
        max-async-requests: 5
      chat:
        options:
          model: glm-5.2
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1536
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2000
        multiplier: 2
        max-interval: 10000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      table-prefix: ""
  type-aliases-package: com.edu.muc.app.modules.resume.domain

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:my-interview}
  secure: false

# RAG 配置
rag:
  retrieval:
    top-k: 15
    final-top-k: 5
    similarity-threshold: 0.3
